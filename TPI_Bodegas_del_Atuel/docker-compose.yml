version: "3.8"

services:
  db:
    image: postgres:16
    container_name: bodegas_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bodegas_pgdata:/var/lib/postgresql/data
      - ./db/tests:/tests:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bodegas_net

  migrate:
    image: postgres:16
    container_name: bodegas_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: db
      PGPORT: 5432
      app_password: ${APP_DB_PASSWORD}
      ro_password: ${RO_DB_PASSWORD}
    command: >
      sh -c "
        until psql -v ON_ERROR_STOP=1 -c '\\l' > /dev/null 2>&1; do
          echo 'Esperando a que db esté lista...';
          sleep 2;
        done;
        echo 'Creando schema ops si no existe...';
        psql -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS ops;';
        psql -v ON_ERROR_STOP=1 -c '
          CREATE TABLE IF NOT EXISTS ops.schema_migrations (
            nombre TEXT PRIMARY KEY,
            aplicado_en TIMESTAMP NOT NULL DEFAULT now()
          );
        ';
        for f in /migrations/*.sql; do
          nombre=$(basename \"\$f\");
          ya_aplicado=$(psql -tA -c \"SELECT count(*) FROM ops.schema_migrations WHERE nombre='\$nombre';\");
          if [ \"\$ya_aplicado\" = \"0\" ]; then
            echo 'Aplicando migración: '\$nombre;
            psql -v ON_ERROR_STOP=1 -v app_password='\$app_password' -v ro_password='\$ro_password' -f \"\$f\";
            psql -v ON_ERROR_STOP=1 -c \"INSERT INTO ops.schema_migrations (nombre) VALUES ('\$nombre');\";
          else
            echo 'Saltando migración ya aplicada: '\$nombre;
          fi;
        done;
        echo 'Migraciones completadas.';
      "
    networks:
      - bodegas_net

  api:
    build: ./api
    container_name: bodegas_api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      API_PORT: ${API_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${API_PORT}:8000"
    networks:
      - bodegas_net

  front:
    image: nginx:alpine
    container_name: bodegas_front
    volumes:
      - ./front:/usr/share/nginx/html:ro
    ports:
      - "${FRONT_PORT}:80"
    networks:
      - bodegas_net

  seed:
    build: ./db/seed
    container_name: bodegas_seed
    profiles:
      - seed
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SEED: ${SEED}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bodegas_net

volumes:
  bodegas_pgdata:

networks:
  bodegas_net:
    driver: bridge
